seed: 1111
deterministic: true
use_amp: true
amp_dtype: bf16
data:
  data_path: datasets/physassets_subset/train.txt
  validation_path: datasets/physassets_subset/validation.txt
  resize_h: 512
  square_crop: true
  num_input_frames: 4
  num_target_frames: 8
  target_has_input: true
  random_crop: 1.0
  scene_scale: 1.0
model:
  use_dinov3: true
  dinov3_dim: 1024
  num_layers: 24
  patch_size: 16
  dim: 1024
  block_type: transformer
  transformer:
    head_dim: 64
  num_global_tokens: 3
  post_act: false
  gaussians:
    sh_degree: 0
    near_plane: 0.001
    far_plane: 2.5
    scale_bias: -7.5
    scale_max: -2.0
    opacity_bias: -1.5
    align_to_pixel: true
    max_dist: 2.0
    prune_ratio: 0.0
    opacity_threshold: 0.001
training:
  batch_size_per_npu: 1
  train_steps: 100000
  grad_accum_steps: 8
  lr: 0.0002
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.05
  warmup_steps: 5000
  scheduler_type: cosine
  grad_clip_norm: 30.0
  num_workers: 4
  prefetch_factor: 2
  pin_memory: false
  l2_loss: 1.0
  opacity_loss: 0.1
  physical_loss: 0.1
  E_loss: 0.01
  nu_loss: 0.01
  lpips_loss: 0.0
  lpips_weights: weights/lpips
  render_backend: cann
  checkpoint_transformer: false
  checkpoint_renderer: false
  fixed_batch: false
  print_every: 10
  evaluation_every: 1000
  checkpoint_every: 1000
  visualization_every: 1000
  tensorboard: true
  max_overflow_windows: 100
