[project]
name = "physgm-cann"
version = "0.1.0"
description = "PhysGM network prediction on Ascend TorchNPU"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torch-npu==2.7.1.post8; sys_platform == 'linux'",
    "transformers==4.57.1",
    "numpy==1.26.4",
    "einops==0.8.0",
    "easydict==1.13",
    "PyYAML==6.0.2",
    "Pillow==10.4.0",
    "opencv-python-headless==4.8.1.78",
    "plyfile==1.0.3",
]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
